name: Easylumi 每日热榜更新

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  update-hot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r backend/requirements.txt

      - name: 抓取热榜 + AI改写
        run: python backend/fetch_hot.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: 提交更新后的热榜数据
        run: |
          git config user.name "easylumi-bot"
          git config user.email "bot@easylumi.local"
          git add data/hot_data.json
          git commit -m "更新热榜数据" || echo "No changes"
          git push
