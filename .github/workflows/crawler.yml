name: Daily Content Crawler & AI Rewrite

on:
  schedule:
    # 每天北京时间早上6点运行 (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: '手动触发原因'
        required: false
        default: '手动更新数据'

jobs:
  crawl-and-generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4

    - name: Run crawler & AI rewrite
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      run: |
        python crawler/crawler.py

    - name: Commit and push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/
        git diff --cached --quiet || (git commit -m "📅 $(date +%Y-%m-%d) 自动更新内容数据" && git push)
